name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install semgrep
      - run: semgrep scan --config p/python --config p/secrets --error nortix

  tests:
    # Versions below must match the Frappe major release in use; check the CI file generated by `bench new-app`.
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=10
      redis-cache:
        image: redis:alpine
        ports: ["13000:6379"]
      redis-queue:
        image: redis:alpine
        ports: ["11000:6379"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: nortix
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install bench
        run: pip install frappe-bench
      - name: Init bench
        run: |
          bench init --skip-redis-config-generation --skip-assets --frappe-branch version-16 ~/frappe-bench
          cd ~/frappe-bench
          bench get-app --branch version-16 erpnext
          bench get-app --branch version-16 hrms
          bench get-app nortix "$GITHUB_WORKSPACE/nortix"
      - name: Create test site
        working-directory: /home/runner/frappe-bench
        run: |
          bench set-config -g redis_cache redis://localhost:13000
          bench set-config -g redis_queue redis://localhost:11000
          bench new-site test.localhost --db-root-password root --admin-password admin --mariadb-user-host-login-scope='%'
          bench --site test.localhost install-app erpnext hrms nortix
          bench --site test.localhost set-config allow_tests true
      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: bench --site test.localhost run-tests --app nortix
